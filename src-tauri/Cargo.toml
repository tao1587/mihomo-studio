[package]
name = "mihomo-studio"
version = "0.1.0"
description = "Cross-platform Mihomo subscription and rules profile generator"
authors = ["Mihomo Studio Contributors"]
edition = "2021"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mihomo_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "stream", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.22.1"
futures-util = "0.3"
sha2 = "0.10"
url = "2"
percent-encoding = "2.3"
yaml-rust2 = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["net", "rt", "time"] }
